<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lanista Arena - Asset Viewer</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #222; font-family: sans-serif; color: #fff; }
        #ui-panel { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 20px; border-radius: 8px; border: 1px solid #444; width: 300px; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        label { font-size: 0.9em; color: #bbb; }
        select, button { background: #333; color: white; border: 1px solid #555; margin-bottom: 10px; padding: 8px; border-radius: 4px; font-size: 1em; cursor: pointer; }
        select:focus, button:focus { outline: none; border-color: #e67e22; }
        button:hover { background: #444; }
        #equipper-btn { background: #e74c3c; font-weight: bold; margin-top: 20px; transition: 0.2s background; }
        #equipper-btn.active { background: #27ae60; }
        canvas { display: block; image-rendering: pixelated; }
    </style>
</head>
<body>
    <div id="ui-panel">
        <h2 style="margin: 0 0 10px 0; color: #e67e22;">Anim Viewer</h2>
        <p style="margin: 0 0 15px 0; font-size: 0.8em; color: gray;">Laboratorio para ver cómo aplican las capas de equipo y testear animaciones aisladas.</p>
        
        <label for="class-select">Clase (Raza):</label>
        <select id="class-select">
            <option value="pelado">Humano Pelado</option>
            <option value="goblin">Goblin</option>
            <option value="succubus">Succubus</option>
        </select>

        <label for="dir-select">Dirección Isométrica:</label>
        <select id="dir-select">
            <option value="south">Sur (Frente)</option>
            <option value="south-east">Sureste</option>
            <option value="east">Este (Derecha)</option>
            <option value="north-east">Noreste</option>
            <option value="north">Norte (Espaldas)</option>
            <option value="north-west">Noroeste</option>
            <option value="west">Oeste (Izquierda)</option>
            <option value="south-west">Suroeste</option>
        </select>

        <label for="anim-select">Ciclo de Animación:</label>
        <select id="anim-select">
            <option value="IDLE">Rotación Base (Quieto)</option>
            <option value="run">Correr (run)</option>
            <option value="attack_fast">Ataque (attack_fast)</option>
            <option value="dodge">Esquivar (dodge)</option>
            <option value="cheer">Victoria (cheer)</option>
            <option value="die">Muerte (die)</option>
            <option value="lv4">🔮 Habilidad Lv4 (lv4)</option>
            <option value="lv8">🌀 Habilidad Lv8 (lv8)</option>
            <option value="lv12">🔥 Habilidad Lv12 (lv12)</option>
        </select>

        <label for="speed-range">Velocidad del Bucle: <span id="speed-val">100%</span></label>
        <input type="range" id="speed-range" min="0.1" max="2" step="0.1" value="1">

        <button id="equipper-btn">Equipar Capa "Armadura Temporal" [OFF]</button>
    </div>

    <!-- ES Module Shims for Three.js import -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.156.1/build/three.module.js"
        }
    }
    </script>

    <script type="module" src="src/viewer.js?v=2"></script>
</body>
</html>
